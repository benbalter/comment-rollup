on:
  issue_comment: {}
  discussion_comment: {}

name: Rollup weekly comments

# The action rewrites the issue or discussion body with the rollup.
permissions:
  issues: write
  discussions: write

jobs:
  comment_rollup:
    runs-on: ubuntu-latest
    name: Comment rollup

    steps:
      - name: Rollup comments
        uses: benbalter/comment-rollup@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          link_to_doc: true
          label: weekly-rollup
