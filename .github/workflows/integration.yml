on:
  issue_comment: {}
  discussion_comment: {}

name: Rollup weekly comments

# The action rewrites the issue or discussion body with the rollup.
permissions:
  issues: write
  discussions: write

jobs:
  comment_rollup:
    runs-on: ubuntu-latest
    name: Comment rollup

    steps:
      # dist/ isn't committed, so build the action from the default branch before running it.
      # --ignore-scripts: this job holds a write token, and the build doesn't need install scripts.
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run package

      - name: Rollup comments
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          link_to_doc: true
          label: weekly-rollup
