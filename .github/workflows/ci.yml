name: 'build-test'
on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'
  workflow_dispatch:

# Read-only by default; the live `test` job grants itself what it needs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run format-check
      - run: npm run lint-check
      - run: npm test

  test:
    # Runs the action against a live issue, which needs a write token
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      # dist/ isn't committed, so build the action before running it.
      # --ignore-scripts: this job holds a write token, and the build doesn't need install scripts.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run package
      - uses: ./
        with:
          number: 3
          token: ${{ secrets.GITHUB_TOKEN }}
          link_to_doc: true
